# Fortium Partners — Shared Claude Code Workflow
#
# Two jobs, both gated for COST and SAFETY. Reusable via `workflow_call`.
#
#   1. claude          — runs ONLY on an explicit `@claude` mention (or a
#                        `claude` label) by an org Member/Owner/Collaborator.
#                        It NEVER auto-runs on issue-open or on every PR.
#                        Pinned to Sonnet.
#                        NOTE: the @claude mention gate keys off
#                        `author_association`, which only reads OWNER/MEMBER
#                        for org members with PUBLIC membership. A maintainer
#                        with PRIVATE org membership will be seen as
#                        CONTRIBUTOR/NONE and their @claude will be ignored
#                        (fails safe — no run, no error). Such users should
#                        either make membership public or use the `claude`
#                        label (which requires triage permission) to trigger.
#   2. security-review — runs on REAL pull requests only: non-draft,
#                        non-bot author, at opened/reopened/ready_for_review
#                        (NOT on every `synchronize` push). Pinned to Sonnet.
#                        Skipped on PRs labelled `claude-session` (reviewed by
#                        /loop-pr-review); a merged one without `loop-clean`
#                        gets a backstop review, filed as an issue by
#                        backstop-issue. pr-labels reads the live labels;
#                        clear-loop-clean drops `loop-clean` on a push (#4).
#
# Why this shape: the previous version auto-ran the full agent on every
# opened issue and ran an Opus-default security review on every PR push
# (including renovate/dependabot), which billed the shared ANTHROPIC_API_KEY
# heavily and let any opened issue trigger an unattended agent.
#
# Thin caller (consuming repo `.github/workflows/claude.yml`):
#
#   name: Claude Code
#   on:
#     issues:
#       types: [opened, labeled]
#     issue_comment:
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#     pull_request:
#       types: [opened, reopened, ready_for_review, synchronize, closed]
#       # A repo that turns off the open-time review keeps only
#       # [synchronize, closed]: the backstop and the loop-clean reset.
#   jobs:
#     claude:
#       # The most any job here needs; a job asking for more than its caller
#       # grants fails to start.
#       permissions:
#         actions: read
#         contents: write
#         pull-requests: write
#         issues: write
#         id-token: write
#       # Pin to a commit SHA (or release tag), NOT @main. @main is a moving
#       # ref: a malicious change to this public repo's main would execute in
#       # your repo on the next event. A SHA requires a deliberate, reviewed
#       # bump (Renovate can automate it).
#       uses: FortiumPartners/.github/.github/workflows/claude.yml@<commit-sha>
#       # Pass ONLY the key this workflow needs — never `secrets: inherit`,
#       # which would hand this shared workflow ALL of your repo's secrets
#       # (DB creds, deploy keys, cloud creds) if it were ever compromised.
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#       # Optional overrides:
#       # with:
#       #   exclude-directories: "node_modules,dist,playwright-tests"
#       #   enable-security-review: false

name: Claude Code (Shared)

on:
  workflow_call:
    inputs:
      agent-model:
        type: string
        default: claude-sonnet-4-6
        description: Model for the @claude agent job.
      security-review-model:
        type: string
        default: claude-sonnet-4-6
        description: Model for the PR security review.
      enable-security-review:
        type: boolean
        default: true
        description: Set false to skip the PR security-review job entirely.
      exclude-directories:
        type: string
        default: node_modules,dist,build,.next,coverage
        description: Comma-separated dirs excluded from the security scan.
    secrets:
      # Used only by security-review: claude-code-security-review has no
      # federation support yet. The claude job authenticates by federation.
      ANTHROPIC_API_KEY:
        required: true

jobs:
  claude:
    # Explicit, authorized invocation ONLY. Never auto-run on issue-open
    # or pull_request. Authorized = org Member/Owner/Collaborator, never a bot.
    # (Applying the `claude` label already requires triage permission, so the
    # label branch is implicitly authorized; the bot guard blocks bot labelers.)
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'issues' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        # SHA-pinned (not the moving @v1 major tag) so a re-pointed tag can't
        # silently change the agent. SHA = v1 tag @ 2026-09-25, which includes
        # the fix for federation + plugins failing with jti_reused
        # (anthropics/claude-code-action#1407); the 2026-06-09 pin predated it.
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790
        with:
          # No API key: the job exchanges its GitHub OIDC token for a short-lived
          # Anthropic token (workload identity federation, Fortium Software org,
          # GitHub Actions workspace). The rule accepts only this workflow file in
          # FortiumPartners. None of these IDs is a secret.
          anthropic_federation_rule_id: fdrl_01PFiHc7DKGfteqTfdgWGo3N
          anthropic_organization_id: ffb150e6-b19e-40ed-92a1-72e5061c6dcb
          anthropic_service_account_id: svac_01MLJi4ksGDjGWq5mvT935Zd
          anthropic_workspace_id: wrkspc_01DjRb8W4JJaCipyPugTZ2Fs
          # Pin the model — unset defaults to the most expensive tier.
          claude_args: "--model ${{ inputs.agent-model }}"
          track_progress: true
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |
            code-review@claude-plugins-official

  pr-labels:
    # Reads the PR's LIVE labels for security-review (#4). `gh pr create
    # --label` applies the label about a second after the PR opens, as a
    # separate `labeled` event, so the `opened` payload does not carry it.
    # A label applied after this read is missed, and the paid review runs:
    # that direction costs money, never an unreviewed merge.
    if: |
      inputs.enable-security-review == true &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    outputs:
      session: ${{ steps.labels.outputs.session }}
    steps:
      - name: Read PR labels
        id: labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$REPO/issues/$PR/labels?per_page=100" --jq '.[].name')
          if grep -qxF claude-session <<<"$labels"; then echo "session=true"; else echo "session=false"; fi >> "$GITHUB_OUTPUT"

  security-review:
    # Two modes (#4):
    #  - open: real PRs only (non-draft, non-bot) at open/reopen/
    #    ready_for_review, and NOT labelled `claude-session`. A session PR is
    #    reviewed by /loop-pr-review before merge. Skipping `synchronize`
    #    avoids re-reviewing every WIP push; skipping bots avoids reviewing
    #    every renovate/dependabot bump. If pr-labels failed, its outputs are
    #    empty and the PR is reviewed.
    #  - backstop: a merged `claude-session` PR without `loop-clean`, i.e.
    #    merged without a clean local loop. Labels come from the `closed`
    #    payload, which is current at merge. backstop-issue files the result.
    needs: pr-labels
    if: |
      always() &&
      inputs.enable-security-review == true &&
      github.event_name == 'pull_request' && (
        (contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action) &&
          github.event.pull_request.draft == false &&
          github.event.sender.type != 'Bot' &&
          needs.pr-labels.outputs.session != 'true') ||
        (github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          contains(github.event.pull_request.labels.*.name, 'claude-session') &&
          !contains(github.event.pull_request.labels.*.name, 'loop-clean'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # No id-token: the security-review action authenticates with
      # claude-api-key and posts via github.token — it never requests an
      # OIDC token. Omitting it removes an unused OIDC escalation surface
      # (the token-exchange step abused in the GMO Flatt attack).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Security Review
        # Pinned to a SHA (no upstream release tags exist) to avoid a
        # floating @main supply-chain ref. Bump deliberately when reviewing
        # upstream changes. SHA = main @ 2026-06-08.
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pin the model — unset defaults to claude-opus-4-1 (most expensive).
          claude-model: ${{ inputs.security-review-model }}
          exclude-directories: ${{ inputs.exclude-directories }}
          # Backstop runs on a merged PR: its output is an issue, not a review.
          comment-pr: ${{ github.event.action != 'closed' }}
          # The action caches a "reserved" marker BEFORE it calls Claude and
          # skips the scan whenever a marker exists, so re-running a refused
          # review would scan nothing. The job's `if:` already excludes
          # `synchronize`, so this only re-reviews on a re-run or reopen.
          run-every-commit: true

      - name: Fail when no review ran
        id: review-gate
        # The action turns a refused or crashed review into a warning and
        # findings_count=0, so the job went green on reviews that never
        # happened (FortiumPartners/.github#6: HTTP 400 at the spend cap,
        # 2026-10-16..30). Its audit script writes {"error": ...} on every
        # failure path and a findings list on success. Exit status is not
        # exposed, and it is 1 on HIGH findings anyway, so read the file.
        shell: bash
        run: |
          results=claudecode-results.json
          log_hint="see claudecode-error.log in the security-review-results artifact"
          if [ ! -s "$results" ]; then
            echo "::error::Security review produced no results; $log_hint"
            exit 1
          fi
          if ! jq -e 'type == "object"' "$results" >/dev/null 2>&1; then
            echo "::error::Security review results are not a JSON object; $log_hint"
            exit 1
          fi
          if jq -e 'has("error")' "$results" >/dev/null; then
            # One line, so error text cannot start a workflow command.
            msg=$(jq -r '.error | tostring | gsub("[\r\n]+"; " ")' "$results")
            echo "::error::Security review did not run: $msg"
            exit 1
          fi
          if ! jq -e '.findings | type == "array"' "$results" >/dev/null; then
            echo "::error::Security review results hold no findings list; $log_hint"
            exit 1
          fi
          # Claude exited 0 but its reply held no parseable findings.
          if jq -e '.analysis_summary.review_completed == false' "$results" >/dev/null; then
            echo "::error::Security review did not complete: Claude's reply held no findings; $log_hint"
            exit 1
          fi
          echo "Security review ran: $(jq '.findings | length' "$results") finding(s)."

  backstop-issue:
    # Files the backstop review's result as an issue (#4). Nobody watches the
    # checks of a merged PR, so findings, or a review that did not run, have
    # to land somewhere a person will see. Only this job may write issues.
    needs: security-review
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      contains(fromJSON('["success","failure"]'), needs.security-review.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.security-review.result == 'success'
        with:
          name: security-review-results

      - name: File backstop issue
        id: file-issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_RESULT: ${{ needs.security-review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr_url="https://github.com/$REPO/pull/$PR"
          if [ "$REVIEW_RESULT" != "success" ]; then
            title="security-review backstop: merged PR #$PR was not reviewed"
            printf 'Merged PR %s carried the claude-session label without loop-clean, so the backstop security review ran on it, and the review did not complete (%s).\n\nRun: %s\n\nReview the PR by hand or re-run the job once the API is available.\n' \
              "$pr_url" "$REVIEW_RESULT" "$RUN_URL" > body.md
            labels=(bug P1)
          else
            results=claudecode-results.json
            n=$(jq '.findings | length' "$results")
            if [ "$n" -eq 0 ]; then
              echo "Backstop review of merged PR #$PR found nothing." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            title="security-review backstop: $n finding(s) in merged PR #$PR"
            {
              printf 'Merged PR %s carried the claude-session label without loop-clean, so the backstop security review ran on the merged code.\n\nRun: %s\n\n' "$pr_url" "$RUN_URL"
              # A zero-width space after each @ keeps finding text, which
              # quotes the PR's code, from notifying users and teams.
              jq -r '.findings[] | "### \(.severity // "?") \(.category // "") at `\(.file // "?"):\(.line // "?")`\n\n\(.description // "")\n\n**Recommendation:** \(.recommendation // "")\n" | gsub("@"; "@​")' "$results"
            } > body.md
            if jq -e 'any(.findings[]; (.severity // "" | ascii_upcase) == "HIGH")' "$results" >/dev/null; then
              labels=(bug security P1)
            else
              labels=(bug security P2)
            fi
          fi
          # A re-run must not file the same issue twice. Only an open issue
          # this workflow filed, with exactly this title, counts: the title
          # search is fuzzy, and anyone could open a look-alike issue.
          existing=$(gh issue list -R "$REPO" --state open --author app/github-actions \
              --search "\"$title\" in:title" --json url,title \
            | jq -r --arg t "$title" 'map(select(.title == $t))[0].url // empty')
          if [ -n "$existing" ]; then
            echo "Already filed: $existing"
            exit 0
          fi
          args=()
          for l in "${labels[@]}"; do
            gh api "repos/$REPO/labels/$l" >/dev/null 2>&1 || gh label create "$l" -R "$REPO"
            args+=(--label "$l")
          done
          gh issue create -R "$REPO" --title "$title" --body-file body.md "${args[@]}"

  clear-loop-clean:
    # A push to a PR means its head was never through the loop that applied
    # `loop-clean` (#4). Sessions remove the label after their own pushes;
    # this catches a push from a person or another tool, which would
    # otherwise let the PR merge past the backstop. Keyed off the push-time
    # payload; if this job waits in the runner queue past a re-label, it
    # strips the new label too, and the merge costs one backstop review.
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'loop-clean')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove loop-clean
        id: clear
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if out=$(gh api -X DELETE "repos/$REPO/issues/$PR/labels/loop-clean" 2>&1); then
            echo "Removed loop-clean from #$PR."
          elif grep -q "HTTP 404" <<<"$out"; then
            echo "loop-clean was already gone from #$PR."
          else
            printf '%s\n' "$out"
            echo "::error::Could not remove loop-clean from #$PR."
            exit 1
          fi
