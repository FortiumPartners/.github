# Throwaway e2e for FortiumPartners/.github#6. Never merged: calls the shared
# workflow from this PR's head with a deliberately invalid API key, so the
# security-review job must conclude failure.
name: E2E security-review refusal

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    uses: ./.github/workflows/claude.yml
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.SECURITY_REVIEW_E2E_KEY }}
